<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Panopticon | User Directory</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../assets/css/styles.css?v=5">

    <!-- Appwrite SDK -->
    <script src="https://cdn.jsdelivr.net/npm/appwrite@16.1.0"></script>

    <style>
        .directory-container {
            width: 100%;
            max-width: 1400px;
            margin-bottom: 2rem;
        }

        .user-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .user-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.75rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .user-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-4px);
        }

        .user-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .user-info {
            display: flex;
            flex-direction: column;
        }

        .user-name {
            font-weight: 700;
            color: #fff;
            font-size: 1.1rem;
            margin-bottom: 0.25rem;
        }

        .user-email {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .status-badge {
            font-size: 0.7rem;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .status-online {
            background: rgba(0, 247, 160, 0.1);
            color: var(--success-color);
            border: 1px solid rgba(0, 247, 160, 0.2);
        }

        .status-offline {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .user-stats {
            display: flex;
            gap: 1.5rem;
            border-top: 1px solid var(--border-color);
            padding-top: 1.25rem;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 0.25rem;
        }

        .stat-value {
            font-weight: 700;
            color: #fff;
            font-size: 1rem;
        }

        .view-btn {
            background: var(--accent-color);
            color: #000;
            text-align: center;
            padding: 0.75rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .view-btn:hover {
            filter: brightness(1.1);
            transform: scale(1.02);
        }
    </style>
</head>

<body>
    <div class="app-layout">
        <button class="mobile-menu-toggle" id="menu-toggle">
            <svg viewBox="0 0 24 24">
                <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
            </svg>
        </button>

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo">PANOPTICON<span>.</span></div>

            <button id="collapse-btn" class="collapse-btn" aria-label="Collapse Sidebar">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                    <span>Overview</span>
                </a>
                <a href="users.html" class="nav-item active" id="nav-users">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                    <span>User Directory</span>
                </a>
                <a href="admin.html" class="nav-item" id="nav-admin">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    </svg>
                    <span>Admin Console</span>
                </a>
                <hr style="border: none; border-top: 1px solid rgba(0,0,0,0.1); margin: 0.5rem 0; width: 100%;">
                <a href="focus.html" class="nav-item">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    <span>Focus Time</span>
                </a>
                <a href="apps.html" class="nav-item">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                        <polyline points="2 17 12 22 22 17"></polyline>
                        <polyline points="2 12 12 17 22 12"></polyline>
                    </svg>
                    <span>App Usage</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <a href="#" id="sidebar-logout" class="nav-item">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    <span>Sign Out</span>
                </a>
            </div>
        </aside>

        <main class="main-scroll-area">
            <div class="dashboard-header">
                <div>
                    <h2 style="margin:0; font-weight:300;">USER DIRECTORY</h2>
                    <p style="opacity: 0.5; font-size: 0.9rem;">Organization Member Status</p>
                </div>
                <div style="display: flex; gap: 1rem; align-items: center;">
                    <p class="greeting" style="margin:0;">ADMIN: <span id="user-name">...</span></p>
                </div>
            </div>

            <div class="directory-container">
                <div class="user-grid" id="user-grid">
                    <!-- User cards injected by JS -->
                    <div style="grid-column: 1/-1; text-align: center; padding: 4rem; opacity: 0.5;">
                        Loading member directory...
                    </div>
                </div>
            </div>

            <footer>
                &copy; 2026 Panopticon Project | Administrative Access
            </footer>
        </main>
    </div>

    <!-- Scripts -->
    <script src="../assets/js/users.js"></script>
</body>

</html>
