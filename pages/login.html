<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Panopticon | Login</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/auth.css">

    <!-- Appwrite SDK -->
    <script src="https://cdn.jsdelivr.net/npm/appwrite@16.1.0"></script>
</head>

<body>
    <div class="login-container">
        <div class="login-box">
            <img src="../assets/images/Picture1.svg" alt="Panopticon Logo" class="logo-img">
            <form id="login-form">
                <label for="username">Email</label>
                <input type="email" id="username" placeholder="vladu@example.com" required>
                <label for="password">Password</label>
                <input type="password" id="password" required>
                <button type="submit" class="login-btn">Login</button>
            </form>
        </div>
    </div>
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/login.js"></script>
</body>

</html>
