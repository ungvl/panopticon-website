<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Panopticon | App Usage</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../assets/css/styles.css">

    <!-- Appwrite SDK -->
    <script src="https://cdn.jsdelivr.net/npm/appwrite@16.1.0"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="app-layout">
        <button class="mobile-menu-toggle" id="menu-toggle">
            <svg viewBox="0 0 24 24">
                <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
            </svg>
        </button>

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo">PANOPTICON<span>.</span></div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <span>Overview</span>
                </a>
                <a href="focus.html" class="nav-item">
                    <span>Focus Time</span>
                </a>
                <a href="apps.html" class="nav-item active">
                    <span>App Usage</span>
                </a>
                <a href="coffee.html" class="nav-item">
                    <span>Coffee Tracker</span>
                </a>
                <a href="presence.html" class="nav-item">
                    <span>Presence</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <a href="#" id="sidebar-logout" class="nav-item">Sign Out</a>
            </div>
        </aside>

        <main class="main-scroll-area">
            <div class="dashboard-header">
                <h2 style="margin:0; font-weight:300;">APP USAGE DETAIL</h2>
                <div style="display: flex; gap: 1rem; align-items: center;">
                    <p class="greeting" style="margin:0;">USER: <span id="user-name">...</span></p>
                </div>
            </div>

            <div class="dashboard-grid">
                <!-- App Usage Card -->
                <div class="dashboard-card wide-card">
                    <div class="card-header">
                        <h3>Most Used Applications</h3>
                        <span class="badge">7d</span>
                    </div>
                    <div class="chart-container">
                        <canvas id="appsChart"></canvas>
                    </div>
                </div>

                <!-- Recent Activity Table (Detailed) -->
                <div class="dashboard-card wide-card">
                    <div class="card-header">
                        <h3>Activity Log History</h3>
                    </div>
                    <table class="activity-table">
                        <thead>
                            <tr>
                                <th>App</th>
                                <th>Time</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="activity-rows">
                            <!-- Rows injected by JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <footer>
                &copy; 2026 Panopticon Project
            </footer>
        </main>
    </div>

    <!-- Scripts -->
    <script src="../assets/js/dashboard.js"></script>
    <script>
        const { Client: AppwriteClient, Account: AppwriteAccount } = Appwrite;
        const appwriteClient = new AppwriteClient()
            .setEndpoint('https://cloud.appwrite.io/v1')
            .setProject('68f0d9e300322bff44ec');
        const appwriteAccount = new AppwriteAccount(appwriteClient);

        appwriteAccount.get().then(user => {
            document.getElementById('user-name').innerText = user.name || user.email;
            if (window.initDashboard) window.initDashboard();
        }).catch(err => {
            console.log("Not logged in, redirecting...", err);
            window.location.href = 'login.html';
        });

        const logoutBtn = document.getElementById('sidebar-logout');
        if (logoutBtn) {
            logoutBtn.addEventListener('click', async (e) => {
                e.preventDefault();
                await appwriteAccount.deleteSession('current');
                window.location.href = '../index.html';
            });
        }
    </script>
</body>

</html>
